<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- Nuvem (círculos + base flat, legível em qualquer tamanho) -->
  <g fill="url(#cloud)">
    <circle cx="64" cy="78" r="20"/>
    <circle cx="96" cy="64" r="26"/>
    <circle cx="128" cy="80" r="18"/>
    <rect x="44" y="78" width="104" height="26" rx="13"/>
  </g>
  <!-- Texto -->
  <text x="96" y="166" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">CSLL</text>
  <text x="96" y="184" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#bfdbfe" text-anchor="middle" letter-spacing="4">CLOUD</text>
</svg>