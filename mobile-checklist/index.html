<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' data: blob: 'unsafe-inline' 'unsafe-eval'; img-src * data: blob:; connect-src *;" />
  <title>Alchemy Checklist</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0f172a; color: #fff; font-family: system-ui, sans-serif; }
    .splash { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    .dot { width: 10px; height: 10px; background: #38bdf8; border-radius: 50%; margin: 4px; animation: bounce 1.2s infinite ease-in-out; }
    .dot:nth-child(2) { animation-delay: .15s }
    .dot:nth-child(3) { animation-delay: .3s }
    @keyframes bounce { 0%,80%,100% { transform: scale(0); opacity: .3 } 40% { transform: scale(1); opacity: 1 } }
  </style>
</head>
<body>
  <div class="splash">
    <h1 style="font-size:18px;margin-bottom:16px;letter-spacing:.5px;">Carregando checklist…</h1>
    <div style="display:flex"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>
  <script>
    // Fallback: caso o server.url não esteja configurado, redireciona via JS
    if (location.hostname === 'localhost' || location.protocol === 'file:') {
      location.replace('https://alchemyrotas.com/checklist');
    }
  </script>
</body>
</html>
